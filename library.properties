sentence=Small, simple, and secure MQTT 5.0 client for microcontrollers.
paragraph=A full MQTT 5.0 client for ESP32, ESP8266, Arduino, Raspberry Pi, and more. Supports QoS 0, 1, and 2, retained messages, last will, auto reconnect, and TLS. Works over WiFi, Ethernet, and GSM. You set the buffer size yourself and every call returns a clear result, so no silent failures.
